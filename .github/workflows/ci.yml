name: Gatherly AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21 (for Firebase Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript & ESLint (including Firestore Security Rules)
        run: npm run lint

      - name: Verify Documentation Identifiers & File Paths
        run: npm run verify:docs

      - name: Run Unit, API, Component & Accessibility Tests with Coverage
        run: npx vitest run --coverage

      - name: Run Production Build (Client + Server Bundle)
        run: npm run build
