steps:
  # 1. Install dependencies & run strict verification suite
  - name: 'node:22-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'npm install && npm run lint && npm test && npm run build'

  # 2. Build container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gatherly-ai:$SHORT_SHA'
      - '.'

  # 3. Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gatherly-ai:$SHORT_SHA'

  # 4. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gatherly-ai:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=NODE_ENV=production,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GEMINI_MODEL=gemini-3.8-flash'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest'

substitutions:
  _REGION: 'asia-southeast1'
  _REPO: 'cloud-run-source-deploy'
  _SERVICE_NAME: 'gatherly-ai'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/gatherly-ai:$SHORT_SHA'
